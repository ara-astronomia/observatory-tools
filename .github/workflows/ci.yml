name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          uv-version: "0.11.19"

      - name: Run tests
        run: uv run pytest -v --tb=short
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check catalog identity
        run: node --test tests/test_catalog_identity.js
